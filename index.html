<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alandalus - Performing Arts (Live)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel to compile JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <!-- Notice data-type="module" to allow modern database imports -->
    <script type="text/babel" data-type="module">
        const { useState, useEffect } = React;

        // --- FIREBASE IMPORTS (CLOUD DATABASE) ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- DATABASE SETUP ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'performing-arts-dashboard';
        let app, auth, db;
        
        try {
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            if (firebaseConfig) {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
            }
        } catch (e) {
            console.error("Database initialization bypassed or failed. Running locally only.", e);
        }

        // --- ICON COMPATIBILITY LAYER ---
        const Icon = ({ name, className }) => <i className={`fa-solid fa-${name} ${className || ''} flex items-center justify-center`}></i>;
        const Building = (props) => <Icon name="building" {...props} />;
        const Users = (props) => <Icon name="users" {...props} />;
        const FolderOpen = (props) => <Icon name="folder-open" {...props} />;
        const FileText = (props) => <Icon name="file-alt" {...props} />;
        const Plus = (props) => <Icon name="plus" {...props} />;
        const ChevronRight = (props) => <Icon name="chevron-right" {...props} />;
        const ArrowLeft = (props) => <Icon name="arrow-left" {...props} />;
        const Trash2 = (props) => <Icon name="trash" {...props} />;
        const Music = (props) => <Icon name="music" {...props} />;
        const Video = (props) => <Icon name="video" {...props} />;
        const X = (props) => <Icon name="times" {...props} />;
        const UserCircle = (props) => <Icon name="user-circle" {...props} />;
        const Shield = (props) => <Icon name="shield-alt" {...props} />;
        const Edit2 = (props) => <Icon name="edit" {...props} />;
        const Lock = (props) => <Icon name="lock" {...props} />;
        const Eye = (props) => <Icon name="eye" {...props} />;
        const Menu = (props) => <Icon name="bars" {...props} />;
        const Settings = (props) => <Icon name="cog" {...props} />;
        const Key = (props) => <Icon name="key" {...props} />;
        const ArrowUpDown = (props) => <Icon name="sort" {...props} />;

        const BASE_TIME = Date.now();

        // Default templates used ONLY on the very first fresh load
        const initialDataTemplate = [
          {
            id: 1, name: "North Campus", lastModified: BASE_TIME - 50000, editedBy: null,
            classes: [
              {
                id: 102, name: "Grade 2 Performing Arts", lastModified: BASE_TIME - 40000, editedBy: null,
                materials: [{ id: 1, title: "Intro to Theater.pdf", type: "document", lastModified: BASE_TIME - 30000, editedBy: null }],
                students: [{ id: 1, name: "Alice Johnson", lastModified: BASE_TIME - 20000, editedBy: null }, { id: 2, name: "Bob Smith", lastModified: BASE_TIME - 10000, editedBy: null }]
              }
            ]
          },
          { id: 2, name: "East Campus", classes: [], lastModified: BASE_TIME - 60000, editedBy: null }
        ];

        const initialUsersTemplate = [
          { id: 'u1', name: 'Dr. Alice', username: 'alice', password: '123', role: 'hod', branchId: null, permissions: { manageContent: true, manageUsers: true, editNames: true }, lastModified: BASE_TIME - 90000, editedBy: null },
          { id: 'u2', name: 'Mr. Bob', username: 'bob', password: '123', role: 'branch_admin', branchId: 1, permissions: { manageContent: true, manageUsers: true, editNames: true }, lastModified: BASE_TIME - 80000, editedBy: null },
          { id: 'u3', name: 'Ms. Charlie', username: 'charlie', password: '123', role: 'teacher', branchId: 1, permissions: { manageContent: false, manageUsers: false, editNames: false }, lastModified: BASE_TIME - 70000, editedBy: null },
          { id: 'u4', name: 'Mrs. Davis', username: 'davis', password: '123', role: 'branch_admin', branchId: 2, permissions: { manageContent: true, manageUsers: true, editNames: false }, lastModified: BASE_TIME - 60000, editedBy: null },
        ];

        function App() {
          const [data, setData] = useState(initialDataTemplate);
          const [users, setUsers] = useState(initialUsersTemplate);
          
          // App & Loading States
          const [authUser, setAuthUser] = useState(null);
          const [isLoadingData, setIsLoadingData] = useState(true);

          // Navigation States
          const [activeUserId, setActiveUserId] = useState('u1');
          const [viewMode, setViewMode] = useState('content');
          const [activeBranchId, setActiveBranchId] = useState(null);
          const [activeClassId, setActiveClassId] = useState(null);
          const [activeTab, setActiveTab] = useState('materials'); 
          const [isMobileSidebarOpen, setIsMobileSidebarOpen] = useState(false);
          
          const [sortConfig, setSortConfig] = useState({
            branches: { field: 'name', dir: 'asc' },
            classes: { field: 'name', dir: 'asc' },
            materials: { field: 'name', dir: 'asc' },
            students: { field: 'name', dir: 'asc' },
            users: { field: 'name', dir: 'asc' }
          });
          
          const [modalConfig, setModalConfig] = useState({ isOpen: false, type: null, editingId: null });
          const [formData, setFormData] = useState({});
          const [formError, setFormError] = useState('');

          const currentUser = users.find(u => u.id === activeUserId) || users[0];
          const isHOD = currentUser.role === 'hod';
          
          const canManageBranches = isHOD;
          const canManageContent = isHOD || !!currentUser.permissions?.manageContent;
          const canManageUsers = isHOD || !!currentUser.permissions?.manageUsers;
          const canEditNames = isHOD || !!currentUser.permissions?.editNames;

          const visibleBranches = isHOD ? data : data.filter(b => b.id === currentUser.branchId);
          const activeBranch = data.find(b => b.id === activeBranchId);
          const activeClass = activeBranch?.classes.find(c => c.id === activeClassId);

          // --- DATABASE SYNC LOGIC ---

          // 1. Authenticate to database on start
          useEffect(() => {
            if (!auth) {
              setIsLoadingData(false);
              return;
            }
            const initAuth = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                  await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                  await signInAnonymously(auth);
                }
              } catch (err) {
                console.error("Auth error:", err);
                setIsLoadingData(false);
              }
            };
            initAuth();
            
            const unsubscribe = onAuthStateChanged(auth, (u) => {
              setAuthUser(u);
              if (!u) setIsLoadingData(false);
            });
            return () => unsubscribe();
          }, []);

          // 2. Fetch/Listen for live data changes
          useEffect(() => {
            if (!authUser || !db) return;
            
            const stateRef = doc(db, 'artifacts', appId, 'public', 'data', 'dashboard', 'liveState');
            const unsubscribe = onSnapshot(stateRef, (docSnap) => {
              if (docSnap.exists()) {
                const dbData = docSnap.data();
                if (dbData.branches) setData(dbData.branches);
                if (dbData.users) setUsers(dbData.users);
              } else {
                // First time ever running: Seed the database
                setDoc(stateRef, { branches: initialDataTemplate, users: initialUsersTemplate });
              }
              setIsLoadingData(false);
            }, (error) => {
              console.error("Data sync error:", error);
              setIsLoadingData(false);
            });
            
            return () => unsubscribe();
          }, [authUser]);

          // 3. Helper to instantly push changes to the cloud
          const syncToCloud = async (newBranches, newUsers) => {
            // Optimistic instant UI update
            if (newBranches) setData(newBranches);
            if (newUsers) setUsers(newUsers);

            if (!db || !authUser) return; // Skip if database is unavailable
            
            try {
              const stateRef = doc(db, 'artifacts', appId, 'public', 'data', 'dashboard', 'liveState');
              await setDoc(stateRef, {
                branches: newBranches || data,
                users: newUsers || users
              }, { merge: true });
            } catch (err) {
              console.error("Failed to save changes to cloud:", err);
            }
          };

          // --- AUTO-NAVIGATION ---
          useEffect(() => {
            if (!isHOD) {
              setActiveBranchId(currentUser.branchId);
              const userBranch = data.find(b => b.id === currentUser.branchId);
              if (!userBranch?.classes.some(c => c.id === activeClassId)) {
                setActiveClassId(null);
              }
              if (!canManageUsers && viewMode === 'users') {
                setViewMode('content');
              }
            } else {
              if (viewMode === 'content' && activeBranchId && !data.some(b => b.id === activeBranchId)) {
                setActiveBranchId(null);
              }
            }
          }, [activeUserId, currentUser, isHOD, data, activeClassId, activeBranchId, canManageUsers, viewMode]);

          // --- UI HANDLERS ---
          
          const navigateHome = () => {
            setActiveBranchId(isHOD ? null : currentUser.branchId);
            setActiveClassId(null);
            setViewMode('content');
            setIsMobileSidebarOpen(false);
          };

          const handleFormChange = (e) => {
            const { name, value, type, checked } = e.target;
            setFormData(prev => ({
              ...prev,
              [name]: type === 'checkbox' ? checked : value
            }));
          };

          const handleAddOrEditSubmit = (e) => {
            e.preventDefault();
            setFormError('');
            const { type, editingId } = modalConfig;
            const now = Date.now();
            const currentName = currentUser.name;

            if (type === 'branch' && canManageBranches) {
              if (!editingId) {
                if (formData.createAdmin && users.some(u => u.username === formData.adminUsername)) {
                  setFormError('The admin username is already taken. Please choose another.'); return;
                }
                if (formData.createTeacher && users.some(u => u.username === formData.teacherUsername)) {
                  setFormError('The teacher username is already taken. Please choose another.'); return;
                }
                if (formData.createAdmin && formData.createTeacher && formData.adminUsername === formData.teacherUsername) {
                  setFormError('Admin and Teacher cannot have the same username.'); return;
                }
              }
              
              if (editingId) {
                syncToCloud(data.map(b => b.id === editingId ? { ...b, name: formData.branchName.trim(), lastModified: now, editedBy: currentName } : b), null);
              } else {
                const newBranchId = now;
                const newBranch = { id: newBranchId, name: formData.branchName.trim(), classes: [], lastModified: now, editedBy: currentName };
                const newBranchesList = [...data, newBranch];
                
                const newUsersList = [...users];
                if (formData.createAdmin && formData.adminUsername) {
                  newUsersList.push({
                    id: 'u' + now + 'a', name: formData.adminName, username: formData.adminUsername, password: formData.adminPassword,
                    role: 'branch_admin', branchId: newBranchId, permissions: { manageContent: true, manageUsers: true, editNames: true }, 
                    lastModified: now, editedBy: currentName
                  });
                }
                if (formData.createTeacher && formData.teacherUsername) {
                  newUsersList.push({
                    id: 'u' + now + 't', name: formData.teacherName, username: formData.teacherUsername, password: formData.teacherPassword,
                    role: 'teacher', branchId: newBranchId, permissions: { manageContent: false, manageUsers: false, editNames: false }, 
                    lastModified: now, editedBy: currentName
                  });
                }
                
                syncToCloud(newBranchesList, newUsersList);
                
                setActiveBranchId(newBranch.id);
                setActiveClassId(null);
                setViewMode('content');
                setIsMobileSidebarOpen(false);
              }
            } 
            else if (type === 'user' && canManageUsers) {
              if (users.some(u => u.username === formData.username && u.id !== editingId)) {
                setFormError('This username is already taken. Please choose another.');
                return;
              }
              const userPayload = {
                name: formData.name, username: formData.username, password: formData.password,
                role: formData.role, branchId: isHOD ? parseInt(formData.branchId) : currentUser.branchId,
                permissions: { manageContent: !!formData.manageContent, manageUsers: !!formData.manageUsers, editNames: !!formData.editNames },
                lastModified: now, editedBy: currentName
              };

              if (editingId) {
                syncToCloud(null, users.map(u => u.id === editingId ? { ...u, ...userPayload } : u));
              } else {
                syncToCloud(null, [...users, { id: 'u' + now, ...userPayload }]);
              }
            }
            else if (type === 'class' && activeBranchId && canManageContent) {
              if (editingId && canEditNames) {
                syncToCloud(data.map(branch => branch.id === activeBranchId 
                  ? { ...branch, classes: branch.classes.map(c => c.id === editingId ? { ...c, name: formData.className.trim(), lastModified: now, editedBy: currentName } : c) } : branch
                ), null);
              } else if (!editingId) {
                const newClass = { id: now, name: formData.className.trim(), materials: [], students: [], lastModified: now, editedBy: currentName };
                syncToCloud(data.map(branch => branch.id === activeBranchId ? { ...branch, classes: [...branch.classes, newClass] } : branch), null);
                setActiveClassId(newClass.id);
              }
            }
            else if (type === 'students' && activeBranchId && activeClassId && canManageContent) {
              const names = (formData.studentNames || '').split('\n').map(n => n.trim()).filter(n => n !== '');
              if (names.length > 0) {
                const newStudents = names.map((name, idx) => ({ id: now + idx, name, lastModified: now, editedBy: currentName }));
                syncToCloud(data.map(branch => branch.id === activeBranchId ? {
                  ...branch, classes: branch.classes.map(cls => cls.id === activeClassId ? { ...cls, students: [...cls.students, ...newStudents] } : cls)
                } : branch), null);
              }
            }
            else if (type === 'student' && activeBranchId && activeClassId && canManageContent && canEditNames && editingId) {
              syncToCloud(data.map(branch => branch.id === activeBranchId ? {
                ...branch, classes: branch.classes.map(cls => cls.id === activeClassId 
                  ? { ...cls, students: cls.students.map(s => s.id === editingId ? { ...s, name: formData.studentName.trim(), lastModified: now, editedBy: currentName } : s) } : cls
                )
              } : branch), null);
            }
            else if (type === 'material' && activeBranchId && activeClassId && canManageContent) {
              if (editingId && canEditNames) {
                syncToCloud(data.map(branch => branch.id === activeBranchId ? {
                  ...branch, classes: branch.classes.map(cls => cls.id === activeClassId 
                    ? { ...cls, materials: cls.materials.map(m => m.id === editingId ? { ...m, title: formData.materialTitle.trim(), type: formData.materialType, lastModified: now, editedBy: currentName } : m) } : cls
                  )
                } : branch), null);
              } else if (!editingId) {
                const newMaterial = { id: now, title: formData.materialTitle.trim(), type: formData.materialType || 'document', lastModified: now, editedBy: currentName };
                syncToCloud(data.map(branch => branch.id === activeBranchId ? {
                  ...branch, classes: branch.classes.map(cls => cls.id === activeClassId ? { ...cls, materials: [...cls.materials, newMaterial] } : cls)
                } : branch), null);
              }
            }

            closeModal();
          };

          const handleDeleteItem = (type, id) => {
            if (type === 'branch' && canManageBranches) {
              syncToCloud(data.filter(b => b.id !== id), null);
              if (activeBranchId === id) setActiveBranchId(null);
            } 
            else if (type === 'user' && canManageUsers) {
              syncToCloud(null, users.filter(u => u.id !== id));
              if (activeUserId === id) setActiveUserId(users[0].id);
            }
            else if (canManageContent) {
              if (type === 'class') {
                syncToCloud(data.map(branch => branch.id === activeBranchId ? { ...branch, classes: branch.classes.filter(c => c.id !== id) } : branch), null);
                if (activeClassId === id) setActiveClassId(null);
              }
              else if (type === 'student') {
                syncToCloud(data.map(branch => branch.id === activeBranchId ? {
                  ...branch, classes: branch.classes.map(cls => cls.id === activeClassId ? { ...cls, students: cls.students.filter(s => s.id !== id) } : cls)
                } : branch), null);
              }
              else if (type === 'material') {
                syncToCloud(data.map(branch => branch.id === activeBranchId ? {
                  ...branch, classes: branch.classes.map(cls => cls.id === activeClassId ? { ...cls, materials: cls.materials.filter(m => m.id !== id) } : cls)
                } : branch), null);
              }
            }
          };

          const openModal = (type, editingItem = null) => {
            setFormError('');
            setModalConfig({ isOpen: true, type, editingId: editingItem ? editingItem.id : null });
            
            if (type === 'branch') {
              setFormData(editingItem ? { branchName: editingItem.name } : { createAdmin: false, createTeacher: false });
            } else if (type === 'class') {
              setFormData({ className: editingItem ? editingItem.name : '' });
            } else if (type === 'material') {
              setFormData({ materialTitle: editingItem ? editingItem.title : '', materialType: editingItem ? editingItem.type : 'document' });
            } else if (type === 'students') {
              setFormData({ studentNames: '' });
            } else if (type === 'student') {
              setFormData({ studentName: editingItem ? editingItem.name : '' });
            } else if (type === 'user') {
              if (editingItem) {
                setFormData({
                  name: editingItem.name, username: editingItem.username, password: editingItem.password,
                  role: editingItem.role, branchId: editingItem.branchId || '',
                  manageContent: editingItem.permissions?.manageContent || false,
                  manageUsers: editingItem.permissions?.manageUsers || false,
                  editNames: editingItem.permissions?.editNames || false
                });
              } else {
                setFormData({ role: isHOD ? 'branch_admin' : 'teacher', branchId: isHOD ? (data[0]?.id || '') : currentUser.branchId, manageContent: false, manageUsers: false, editNames: false });
              }
            }
          };

          const closeModal = () => {
            setFormError('');
            setModalConfig({ isOpen: false, type: null, editingId: null });
            setFormData({});
          };

          const sortData = (array, configKey) => {
            const { field, dir } = sortConfig[configKey];
            return [...array].sort((a, b) => {
              if (field === 'name') {
                const nameA = (a.name || a.title || '').toLowerCase();
                const nameB = (b.name || b.title || '').toLowerCase();
                return dir === 'asc' ? nameA.localeCompare(nameB) : nameB.localeCompare(nameA);
              } else if (field === 'date') {
                const dateA = a.lastModified || a.id;
                const dateB = b.lastModified || b.id;
                return dir === 'asc' ? dateA - dateB : dateB - dateA;
              }
              return 0;
            });
          };

          const sortedBranches = sortData(visibleBranches, 'branches');
          
          const visibleUsers = users.filter(u => {
            if (isHOD) return true;
            if (canManageUsers && u.branchId === currentUser.branchId) return true;
            return false;
          });
          const sortedUsers = sortData(visibleUsers, 'users');
          
          const sortedClasses = sortData(activeBranch?.classes || [], 'classes');
          const sortedMaterials = sortData(activeClass?.materials || [], 'materials');
          const sortedStudents = sortData(activeClass?.students || [], 'students');

          const SortDropdown = ({ sortKey }) => (
            <div className="relative flex items-center bg-white border border-gray-200 rounded-xl shadow-sm hover:bg-gray-50 transition-all px-3 py-2.5">
              <ArrowUpDown className="w-4 h-4 text-gray-500 mr-2 shrink-0" />
              <select
                className="bg-transparent text-sm font-semibold text-gray-700 outline-none cursor-pointer appearance-none pr-3"
                value={`${sortConfig[sortKey].field}-${sortConfig[sortKey].dir}`}
                onChange={(e) => {
                  const [field, dir] = e.target.value.split('-');
                  setSortConfig(prev => ({ ...prev, [sortKey]: { field, dir } }));
                }}
              >
                <option value="name-asc">Name (A-Z)</option>
                <option value="name-desc">Name (Z-A)</option>
                <option value="date-desc">Newest Modified</option>
                <option value="date-asc">Oldest Modified</option>
              </select>
            </div>
          );

          const renderModal = () => {
            if (!modalConfig.isOpen) return null;
            const { type, editingId } = modalConfig;

            return (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg my-8 overflow-hidden border border-gray-100">
                  <div className="flex justify-between items-center p-5 border-b border-gray-100 bg-gray-50/80 sticky top-0 z-10">
                    <h3 className="font-bold text-lg text-gray-800">
                      {editingId ? `Edit ${type.charAt(0).toUpperCase() + type.slice(1)}` : `Add New ${type === 'students' ? 'Students' : type.charAt(0).toUpperCase() + type.slice(1)}`}
                    </h3>
                    <button onClick={closeModal} type="button" className="p-1 hover:bg-gray-200 rounded-full text-gray-500 transition-colors">
                      <X className="w-5 h-5" />
                    </button>
                  </div>
                  <form onSubmit={handleAddOrEditSubmit} className="p-5 space-y-5">
                    
                    {type === 'branch' && (
                      <div className="space-y-4">
                        <div>
                          <label className="block text-sm font-semibold text-gray-700 mb-1">Branch Name <span className="text-red-500">*</span></label>
                          <input type="text" autoFocus name="branchName" className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" value={formData.branchName || ''} onChange={handleFormChange} required />
                        </div>
                        
                        {!editingId && (
                          <div className="border border-indigo-100 bg-indigo-50/30 rounded-xl p-4 space-y-4 mt-6">
                            <h4 className="text-sm font-bold text-indigo-900 border-b border-indigo-100 pb-2">Quick Account Creation (Optional)</h4>
                            
                            <div className="bg-white p-3 rounded-lg border border-gray-200 shadow-sm">
                              <label className="flex items-center gap-2 cursor-pointer mb-3">
                                <input type="checkbox" name="createAdmin" checked={formData.createAdmin || false} onChange={handleFormChange} className="w-4 h-4 text-indigo-600 rounded border-gray-300" />
                                <span className="text-sm font-bold text-gray-800">Create Branch Admin</span>
                              </label>
                              {formData.createAdmin && (
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pl-6">
                                  <input type="text" name="adminName" placeholder="Full Name" className="border border-gray-300 rounded-md p-2 text-sm" value={formData.adminName || ''} onChange={handleFormChange} required />
                                  <div className="sm:col-span-2 grid grid-cols-2 gap-3">
                                    <input type="text" name="adminUsername" placeholder="Username" className="border border-gray-300 rounded-md p-2 text-sm" value={formData.adminUsername || ''} onChange={handleFormChange} required />
                                    <input type="text" name="adminPassword" placeholder="Password" className="border border-gray-300 rounded-md p-2 text-sm" value={formData.adminPassword || ''} onChange={handleFormChange} required />
                                  </div>
                                </div>
                              )}
                            </div>

                            <div className="bg-white p-3 rounded-lg border border-gray-200 shadow-sm">
                              <label className="flex items-center gap-2 cursor-pointer mb-3">
                                <input type="checkbox" name="createTeacher" checked={formData.createTeacher || false} onChange={handleFormChange} className="w-4 h-4 text-indigo-600 rounded border-gray-300" />
                                <span className="text-sm font-bold text-gray-800">Create Teacher Account</span>
                              </label>
                              {formData.createTeacher && (
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pl-6">

                          <div className="flex gap-2 w-full sm:w-auto">
                            <SortDropdown sortKey="materials" />
                            {canManageContent && (
                              <button onClick={() => openModal('material')} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold transition-colors flex items-center justify-center gap-2 shadow-sm flex-1 sm:flex-none">
                                <Plus className="w-4 h-4" /> Add Material
                              </button>
                            )}
                          </div>
                        </div>
                        {sortedMaterials.length === 0 ? (
                          <div className="text-center p-10 sm:p-12 bg-white rounded-2xl border border-dashed border-gray-300">
                            <p className="text-gray-500 text-sm sm:text-base">No course materials available for this section.</p>
                          </div>
                        ) : (
                          <div className="bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-sm">
                            <ul className="divide-y divide-gray-100">
                              {sortedMaterials.map(material => (
                                <li key={material.id} className="p-4 sm:p-5 hover:bg-indigo-50/30 flex items-center justify-between group transition-colors">
                                  <div className="flex items-center gap-3 sm:gap-4 min-w-0 pr-4">
                                    <div className="p-2 sm:p-3 bg-gray-50 border border-gray-100 rounded-xl">
                                      {material.type === 'audio' ? <Music className="w-5 h-5 text-purple-500" /> : material.type === 'video' ? <Video className="w-5 h-5 text-red-500" /> : <FileText className="w-5 h-5 text-blue-500" />}
                                    </div>
                                    <div className="min-w-0">
                                      <p className="font-semibold text-gray-900 text-sm sm:text-base truncate">{material.title}</p>
                                      <p className="text-[10px] sm:text-xs font-medium text-gray-500 uppercase tracking-wide mt-0.5">{material.type}</p>
                                      {material.editedBy && <p className="text-[10px] text-gray-400 italic mt-0.5">Edited by {material.editedBy}</p>}
                                    </div>
                                  </div>
                                  <div className="flex items-center gap-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity shrink-0">
                                    {(isHOD || (canManageContent && canEditNames)) && (
                                      <button onClick={() => openModal('material', material)} className="p-1.5 sm:p-2 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg"><Edit2 className="w-4 h-4" /></button>
                                    )}
                                    {canManageContent && (
                                      <button onClick={() => handleDeleteItem('material', material.id)} className="p-1.5 sm:p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg"><Trash2 className="w-4 h-4" /></button>
                                    )}
                                  </div>
                                </li>
                              ))}
                            </ul>
                          </div>
                        )}
                      </div>
                    )}

                    {/* STUDENTS */}
                    {activeTab === 'students' && (
                      <div className="space-y-6">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                          <div>
                            <h3 className="text-lg sm:text-xl font-bold text-gray-900">Enrolled Roster</h3>
                          </div>
                          <div className="flex gap-2 w-full sm:w-auto">
                            <SortDropdown sortKey="students" />
                            {canManageContent && (
                              <button onClick={() => openModal('students')} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold transition-colors flex items-center justify-center gap-2 shadow-sm flex-1 sm:flex-none">
                                <Plus className="w-4 h-4" /> Add Students
                              </button>
                            )}
                          </div>
                        </div>
                        {sortedStudents.length === 0 ? (
                          <div className="text-center p-10 sm:p-12 bg-white rounded-2xl border border-dashed border-gray-300">
                            <p className="text-gray-500 text-sm sm:text-base">No students enrolled yet.</p>
                          </div>
                        ) : (
                          <div className="bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-sm">
                            <ul className="divide-y divide-gray-100 max-h-[60vh] overflow-y-auto">
                              {sortedStudents.map((student, index) => (
                                <li key={student.id} className="p-4 sm:p-5 hover:bg-indigo-50/30 flex items-center justify-between group transition-colors">
                                  <div className="flex items-center gap-3 sm:gap-4 min-w-0 pr-4">
                                    <div className="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-xs sm:text-sm border border-indigo-200 shrink-0">{index + 1}</div>
                                    <div className="flex flex-col min-w-0">
                                      <span className="font-semibold text-gray-800 text-sm sm:text-base truncate">{student.name}</span>
                                      {student.editedBy && <span className="block text-[10px] text-gray-400 italic mt-0.5">Edited by {student.editedBy}</span>}
                                    </div>
                                  </div>
                                  <div className="flex items-center gap-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity shrink-0">
                                    {(isHOD || (canManageContent && canEditNames)) && (
                                       <button onClick={() => openModal('student', student)} className="p-1.5 sm:p-2 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg"><Edit2 className="w-4 h-4" /></button>
                                    )}
                                    {canManageContent && (
                                      <button onClick={() => handleDeleteItem('student', student.id)} className="p-1.5 sm:p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors">
                                        <Trash2 className="w-4 h-4" />
                                      </button>
                                    )}
                                  </div>
                                </li>
                              ))}
                            </ul>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            );
          };

          return (
            <div className="flex flex-col h-screen font-sans text-gray-800 bg-gray-50 overflow-hidden">
              
              {/* HEADER */}
              <header className="bg-white border-b border-gray-200 px-4 sm:px-6 py-3 flex flex-wrap gap-3 items-center justify-between shrink-0 z-20 shadow-sm">
                
                {/* CLICKABLE LOGO -> NAVIGATES HOME */}
                <div 
                  className="flex items-center gap-3 cursor-pointer group" 
                  onClick={navigateHome}
                  title="Return to Main Page"
                >
                  <button className="md:hidden p-1.5 -ml-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors" onClick={(e) => { e.stopPropagation(); setIsMobileSidebarOpen(true); }}>
                    <Menu className="w-6 h-6" />
                  </button>
                  <img 
                    src="https://drive.google.com/uc?export=view&id=1XVavxFZhMwT3f7q3vU1TQsAsXBByC_rX" 
                    alt="Alandalus Logo" 
                    className="w-10 h-10 sm:w-12 sm:h-12 object-contain shrink-0 transition-transform group-hover:scale-105"
                    onError={(e) => { 
                      e.target.onerror = null; 
                      e.target.parentElement.innerHTML = '<div class="w-9 h-9 sm:w-10 sm:h-10 bg-indigo-600 rounded-lg flex items-center justify-center shadow-inner shrink-0 group-hover:bg-indigo-700 transition-colors"><i class="fa-solid fa-building text-white"></i></div>';
                    }}
                  />
                  <div>
                    <h1 className="text-lg sm:text-xl font-bold text-gray-900 leading-tight group-hover:text-indigo-600 transition-colors">Alandalus</h1>
                    <p className="hidden sm:block text-xs text-gray-500 font-medium tracking-wide uppercase">Performing Arts</p>
                  </div>
                </div>

                <div className="flex items-center gap-2 sm:gap-4 bg-gray-50 p-1.5 rounded-xl border border-gray-100">
                  <div className="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-white rounded-lg shadow-sm border border-gray-100">
                    {isHOD ? <Shield className="w-4 h-4 text-emerald-600" /> : <UserCircle className="w-4 h-4 text-indigo-600" />}
                    <span className="text-sm font-semibold text-gray-700">Account:</span>
                  </div>
                  <select 
                    className="bg-transparent text-sm font-medium text-gray-800 outline-none cursor-pointer p-1 pr-4 max-w-[140px] sm:max-w-none truncate"
                    value={activeUserId}
                    onChange={(e) => {
                      setActiveUserId(e.target.value);
                      setIsMobileSidebarOpen(false); 
                    }}
                  >
                    {users.map(u => (
                      <option key={u.id} value={u.id}>{u.name} ({u.role})</option>
                    ))}
                  </select>
                </div>
              </header>

              {/* MAIN CONTAINER */}
              <div className="flex-1 flex overflow-hidden relative w-full">
                
                {/* MOBILE SIDEBAR OVERLAY */}
                {isMobileSidebarOpen && <div className="absolute inset-0 bg-slate-900/60 z-20 md:hidden backdrop-blur-sm transition-opacity" onClick={() => setIsMobileSidebarOpen(false)} />}

                {/* SIDEBAR NAVIGATION */}
                <div className={`absolute md:static inset-y-0 left-0 transform ${isMobileSidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 w-[280px] md:w-72 bg-slate-900 text-white flex flex-col transition-transform duration-300 z-30 shadow-2xl md:shadow-none shrink-0`}>
                  <div className="flex items-center justify-between p-5 md:hidden border-b border-slate-800">
                    <h2 className="text-sm font-bold text-white uppercase tracking-wider">Navigation</h2>
                    <button onClick={() => setIsMobileSidebarOpen(false)} className="p-1 hover:bg-slate-800 rounded-lg text-slate-400"><X className="w-5 h-5" /></button>
                  </div>

                  <div className="p-4 pb-2">
                     <div className="space-y-1">
                       <button 
                         onClick={() => { setViewMode('content'); setIsMobileSidebarOpen(false); }}
                         className={`w-full flex items-center gap-3 p-3 rounded-xl text-sm font-bold transition-all ${viewMode === 'content' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}
                       >
                         <Building className="w-5 h-5" /> Content Branches
                       </button>
                       {canManageUsers && (
                         <button 
                          onClick={() => { setViewMode('users'); setIsMobileSidebarOpen(false); }}
                          className={`w-full flex items-center gap-3 p-3 rounded-xl text-sm font-bold transition-all ${viewMode === 'users' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}
                        >
                          <Settings className="w-5 h-5" /> User Permissions
                        </button>
                       )}
                     </div>
                  </div>

                  <hr className="border-slate-800 my-2 mx-4" />

                  {/* Contextual Sidebar Content based on View Mode */}
                  {viewMode === 'content' && (
                    <div className="p-4 flex-1 overflow-y-auto">
                      <div className="flex items-center justify-between mb-4 px-1">
                        <h2 className="text-xs font-semibold text-slate-400 uppercase tracking-wider">{isHOD ? 'All Branches' : 'My Branch'}</h2>
                      </div>
                      <div className="space-y-1.5">
                        {sortedBranches.length === 0 && <p className="text-sm text-slate-500 italic p-2 bg-slate-800/50 rounded-lg border border-slate-700 border-dashed">No branches available.</p>}
                        {sortedBranches.map(branch => (
                          <div key={branch.id} className="group flex items-center">
                            <button onClick={() => { setActiveBranchId(branch.id); setActiveClassId(null); setIsMobileSidebarOpen(false); }} className={`flex-1 flex items-center justify-between p-3 rounded-xl text-sm font-medium transition-all ${activeBranchId === branch.id ? 'bg-slate-800 text-white shadow-inner border border-slate-700' : 'text-slate-300 hover:bg-slate-800/50 hover:text-white'}`}>
                              <span className="truncate">{branch.name}</span>
                              <ChevronRight className={`w-4 h-4 transition-transform ${activeBranchId === branch.id ? 'opacity-100' : 'opacity-0 md:group-hover:opacity-100'}`} />
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {viewMode === 'users' && (
                    <div className="p-4 flex-1">
                      <p className="text-sm text-slate-400 leading-relaxed px-1">
                        You are currently managing user accounts and access control. Select "Content Branches" to return to course materials.
                      </p>
                    </div>
                  )}
                </div>

                {/* MAIN CONTENT AREA */}
                {viewMode === 'users' ? renderUserManagement() : renderContentDashboard()}

              </div>
              
              {renderModal()}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
